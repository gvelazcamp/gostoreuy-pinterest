<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hojas que cuentan historias</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#242323}body{display:grid;place-items:center}#stage{width:540px;height:800px;position:absolute;left:50%;top:50%;margin:-400px 0 0 -270px;transform-origin:center;overflow:hidden;isolation:isolate;background:#bba389;border-radius:12px}#scene{position:absolute;inset:0}#paper{position:absolute;width:340px;height:510px;left:100px;top:132px;filter:drop-shadow(4px 10px 10px #30271955);transform:rotate(-3deg);transform-origin:center;opacity:0;transition:transform .7s,opacity .4s}#paper img{width:100%;height:100%;display:block;object-fit:fill}#writing{position:absolute;inset:0;overflow:hidden;pointer-events:none}.ink{position:absolute;white-space:nowrap;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-size:16px;font-style:italic;font-weight:500;color:#29416b;line-height:1;letter-spacing:-.35px;transform:rotate(-.45deg);clip-path:inset(0 100% 0 0)}#pen{position:absolute;width:150px;height:23px;z-index:8;transform-origin:0 50%;transform:rotate(-37deg);opacity:0;pointer-events:none;filter:drop-shadow(2px 5px 3px #0004);transition:opacity .2s}#pen svg{width:100%;height:100%;overflow:visible}.magnet{position:absolute;width:24px;height:24px;top:8px;border-radius:50%;background:radial-gradient(circle at 32% 25%,#fff8,transparent 48%),var(--mag,#d85242);box-shadow:1px 4px 5px #0006;z-index:3;opacity:0;transition:opacity .25s}.magnet.a{left:20px}.magnet.b{right:20px}#envelope{position:absolute;width:370px;height:240px;left:85px;top:510px;opacity:0;pointer-events:none;transition:opacity .4s,transform .7s;transform:translateY(130px)}#envelope .back{position:absolute;inset:0;background:var(--env,#d3a774);border-radius:8px;box-shadow:0 8px 18px #0003}#envelope .front{position:absolute;inset:0;background:var(--env2,#e8c99f);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:8px}#heart{position:absolute;left:248px;top:599px;font-size:55px;color:#b83d48;opacity:0;transform:scale(.2);transition:opacity .35s,transform .5s;filter:drop-shadow(1px 3px 2px #0003)}#heart.show{opacity:1;transform:scale(1)}.fridge #paper{transform:rotate(-2deg)}.desk #paper{transform:rotate(-5deg)}.love #paper{transform:rotate(2deg)}.kitchen #paper{transform:rotate(-2deg)}@media(prefers-reduced-motion:reduce){*{transition-duration:0s!important}}
</style></head><body><main id="stage"><div id="scene"></div><div id="envelope"><div class="back"></div><div class="front"></div></div><div id="paper"><img id="art" alt="Hoja ilustrada original"><div id="writing"></div><i class="magnet a"></i><i class="magnet b"></i></div><div id="pen"><svg viewBox="0 0 150 23"><path d="M0 11.5L17 3.5V19.5Z" fill="#d6d8dc"/><path d="M0 11.5L6 8.8V14.2Z" fill="#293143"/><rect x="17" y="3" width="112" height="17" rx="7" fill="#344d72"/><path d="M24 6H122" stroke="#9db6d4" stroke-width="2" stroke-linecap="round"/><rect x="127" y="3" width="22" height="17" rx="6" fill="#c3b394"/><path d="M126 6H102" stroke="#e6d8b8" stroke-width="3" stroke-linecap="round"/></svg></div><div id="heart">♥</div></main><script>
const cfgs={
pluto:{src:'cuaderno-pluto.svg',scene:'fridge',x:.19,y:.18,step:.041,lines:['Lista de compras','✓ Leche y pan','✓ Huevos','✓ Fruta fresca','✓ Queso','✓ Galletitas para Pluto']},
zorrito:{src:'cuaderno-zorrito-bosque.svg',scene:'desk',x:.17,y:.18,step:.045,lines:['Querida amiga:','Que nunca te falten','los pequeños momentos','que hacen especial el día.','Te mando un abrazo.','Con cariño ♥']},
garfield:{src:'cuaderno-garfield.png',scene:'kitchen',x:.23,y:.30,step:.041,lines:['Lasaña de Garfield','Salsa de tomate','Pasta y mucho queso','Capas de amor...','¡Al horno!','No compartir :)']},
snoopy:{src:'cuaderno-snoopy.png',scene:'love',x:.16,y:.30,step:.041,lines:['Para alguien especial:','Gracias por hacer','mis días más lindos.','Te quiero hasta','la luna y de vuelta.','Con todo mi cariño ♥']}
};
const stage=document.querySelector('#stage'),paper=document.querySelector('#paper'),art=document.querySelector('#art'),writing=document.querySelector('#writing'),pen=document.querySelector('#pen'),env=document.querySelector('#envelope'),heart=document.querySelector('#heart');
const cfg=cfgs[new URLSearchParams(location.search).get('hoja')]||cfgs.pluto;stage.className=cfg.scene;
const scene=document.querySelector('#scene');
const grain='<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>';
const scenes={
fridge:'<defs><linearGradient id="metal"><stop stop-color="#c4c7c5"/><stop offset=".2" stop-color="#eceee9"/><stop offset=".64" stop-color="#dce1df"/><stop offset="1" stop-color="#a6b1b1"/></linearGradient>'+grain+'</defs><rect width="540" height="800" fill="#e8d9bc"/><rect x="20" y="-60" width="500" height="920" rx="44" fill="url(#metal)" stroke="#a4afab" stroke-width="3"/><path d="M21 681H519" stroke="#899794" stroke-width="5"/><rect x="468" y="70" width="19" height="175" rx="9" fill="#859391"/><rect x="471" y="73" width="9" height="166" rx="4" fill="#f6f8f4"/><rect x="468" y="704" width="19" height="75" rx="9" fill="#859391"/><circle cx="67" cy="73" r="18" fill="#d9a955"/><path d="M58 73h18M67 64v18" stroke="#fff8" stroke-width="2"/><circle cx="412" cy="710" r="14" fill="#749a7b"/><rect width="540" height="800" filter="url(#grain)" opacity=".035"/>',
desk:'<defs><linearGradient id="wood" x2=".8" y2="1"><stop stop-color="#cfa77b"/><stop offset="1" stop-color="#926b49"/></linearGradient>'+grain+'</defs><rect width="540" height="800" fill="url(#wood)"/><g fill="none" stroke="#614325" opacity=".14" stroke-width="2"><path d="M0 94Q190 107 540 85M0 227Q280 210 540 232M0 359Q300 370 540 340M0 487Q220 474 540 492M0 640Q270 660 540 624M0 740Q230 725 540 748"/></g><rect width="540" height="800" filter="url(#grain)" opacity=".06"/><g transform="translate(459 84)"><circle r="52" fill="#705444" opacity=".25" transform="translate(3 7)"/><circle r="46" fill="#f3e8d7"/><circle r="36" fill="#6a3a24"/><path d="M43 -12q28 -7 22 17t-22 12" fill="none" stroke="#f3e8d7" stroke-width="9"/></g><g transform="translate(52 688) rotate(-30)" fill="#b16e36"><ellipse rx="16" ry="41"/><path d="M0 -40V40" stroke="#70482e"/></g><g transform="translate(87 740) rotate(45)" fill="#dfb05c"><ellipse rx="13" ry="35"/><path d="M0 -35V35" stroke="#a06d3a"/></g>',
kitchen:'<defs><linearGradient id="stone" x2="1" y2="1"><stop stop-color="#eee5d4"/><stop offset="1" stop-color="#d1c4ad"/></linearGradient>'+grain+'</defs><rect width="540" height="800" fill="url(#stone)"/><g fill="none" stroke="#a79b87" opacity=".26"><path d="M-30 100Q300 200 570 120M-30 500Q210 400 570 600M-30 720Q240 600 570 740"/></g><rect width="540" height="800" filter="url(#grain)" opacity=".04"/><g transform="translate(467 686)"><circle r="99" fill="#fff5e4" stroke="#bfaf95" stroke-width="3"/><rect x="-65" y="-45" width="130" height="90" rx="16" fill="#bb5d31" stroke="#8a3f1d" stroke-width="4"/><path d="M-60 -23H60M-60 0H60M-60 25H60" stroke="#f6ca66" stroke-width="9" stroke-linecap="round"/><g fill="#45834a"><ellipse cx="15" cy="-20" rx="8" ry="15" transform="rotate(30)"/><ellipse cx="-22" cy="10" rx="7" ry="14" transform="rotate(-30)"/></g></g><g transform="translate(55 90)"><circle r="26" fill="#c34d31"/><circle cx="-17" cy="31" r="20" fill="#d95b3a"/><path d="M0 -19l-13 -10 10 3 6 -8 5 11 12 2Z" fill="#487c42"/></g>',
love:'<defs><linearGradient id="pink" x2="1" y2="1"><stop stop-color="#f0d9d5"/><stop offset="1" stop-color="#c7a3a5"/></linearGradient>'+grain+'</defs><rect width="540" height="800" fill="url(#pink)"/><rect width="540" height="800" filter="url(#grain)" opacity=".035"/><g transform="translate(466 79) rotate(24)"><path d="M-24 -26Q0 -46 24 -26L29 36H-29Z" fill="#f4e6d9"/><path d="M0 24V-20M0 -5l-15 -13M0 5l14 -15" stroke="#547b59" stroke-width="4"/><circle cy="-23" r="13" fill="#c87988"/><circle cx="-16" cy="-19" r="10" fill="#d7959d"/><circle cx="15" cy="-15" r="11" fill="#e7adb1"/></g><g fill="#b15e6d" opacity=".42"><path d="M40 690C5 665 25 644 40 661C55 644 75 665 40 690Z"/><path d="M482 734C455 711 469 694 482 707C495 694 509 711 482 734Z"/></g>'
};
scene.innerHTML='<svg viewBox="0 0 540 800" width="540" height="800" xmlns="http://www.w3.org/2000/svg">'+scenes[cfg.scene]+'</svg>';
function fit(){stage.style.transform='scale('+Math.min(innerWidth/540,innerHeight/800)+')'}addEventListener('resize',fit);fit();
const wait=ms=>new Promise(r=>setTimeout(r,ms));const frame=()=>new Promise(r=>requestAnimationFrame(r));
function point(x,y){const a=paper.getBoundingClientRect(),b=stage.getBoundingClientRect(),scale=b.width/540;const angle=cfg.scene==='desk'?-5:cfg.scene==='love'?2:-2,rad=angle*Math.PI/180;return [100+170+(x-170)*Math.cos(rad)-(y-255)*Math.sin(rad),132+255+(x-170)*Math.sin(rad)+(y-255)*Math.cos(rad)]}
async function write(line,i){const el=document.createElement('div');el.className='ink';el.textContent=line;const x=cfg.x*340,y=(cfg.y+i*cfg.step)*510;el.style.left=x+'px';el.style.top=y+'px';writing.appendChild(el);const w=el.offsetWidth;const ms=470+line.length*11;const t0=performance.now();pen.style.opacity=1;await new Promise(resolve=>{function draw(now){const t=Math.min(1,(now-t0)/ms),progress=t;el.style.clipPath='inset(0 '+(100-progress*100)+'% 0 0)';const [px,py]=point(x+w*progress,y+13+Math.sin(progress*line.length*3)*2);pen.style.left=px+'px';pen.style.top=(py-11.5)+'px';if(t<1)requestAnimationFrame(draw);else resolve()}requestAnimationFrame(draw)});await wait(70)}
async function play(){art.src=cfg.src;await art.decode();paper.style.opacity=1;await wait(350);if(cfg.scene==='fridge'){paper.querySelectorAll('.magnet').forEach(x=>x.style.opacity=1);await wait(200)}for(let i=0;i<cfg.lines.length;i++)await write(cfg.lines[i],i);pen.style.opacity=0;await wait(750);if(cfg.scene==='desk'||cfg.scene==='love'){env.style.setProperty('--env',cfg.scene==='love'?'#bd6678':'#c79a65');env.style.setProperty('--env2',cfg.scene==='love'?'#e3a5b1':'#ebcfab');env.style.opacity=1;env.style.transform='translateY(0)';await wait(450);paper.style.transform='translateY(85px) rotate(0deg) scale(.72)';await wait(700);if(cfg.scene==='love')heart.classList.add('show')} }
play().catch(()=>{art.src=cfg.src;paper.style.opacity=1});
</script></body></html>
