function crop(region,source){const sx=source.width/cfg.ref[0],sy=source.height/cfg.ref[1],poly=region.map(([x,y])=>[x*sx,y*sy]);const x=Math.floor(Math.min(...poly.map(p=>p[0]))),y=Math.floor(Math.min(...poly.map(p=>p[1]))),w=Math.min(source.width-x,Math.ceil(Math.max(...poly.map(p=>p[0]))-x)+1),h=Math.min(source.height-y,Math.ceil(Math.max(...poly.map(p=>p[1]))-y)+1);const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.beginPath();poly.forEach(([px,py],i)=>i?ctx.lineTo(px-x,py-y):ctx.moveTo(px-x,py-y));ctx.closePath();ctx.clip();ctx.drawImage(source,-x,-y);return {src:c.toDataURL('image/png'),x,y,w,h};}

const bg=new Uint8Array(n),q=new Int32Array(n);let head=0,tail=0;function add(p){let i=p*4;if(!bg[p]&&(d[i+3]<30||colors.some(a=>Math.hypot(d[i]-a[0],d[i+1]-a[1],d[i+2]-a[2])<40))){bg[p]=1;q[tail++]=p}}
