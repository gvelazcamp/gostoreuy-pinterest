name: Exportar carta Snoopy a MP4
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exportar-snoopy-mp4.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar navegador y conversor
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Capturar animación original
        run: |
          mkdir -p videos /tmp/snoopy-capture
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/snoopy-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          with sync_playwright() as p:
              browser = p.chromium.launch(args=['--no-sandbox'])
              ctx = browser.new_context(viewport={'width':1080,'height':1920}, device_scale_factor=1, record_video_dir='/tmp/snoopy-capture', record_video_size={'width':1080,'height':1920})
              page = ctx.new_page()
              page.goto('http://127.0.0.1:8765/demo-hojas-ilustradas.html?hoja=snoopy')
              page.locator('#art').evaluate('(img) => img.decode()')
              page.wait_for_timeout(8200)
              video = page.video
              page.close()
              ctx.close()
              video.save_as('/tmp/snoopy-capture/source.webm')
              browser.close()
          PY
          ffmpeg -y -i /tmp/snoopy-capture/source.webm -c:v libx264 -pix_fmt yuv420p -r 30 -crf 20 -movflags +faststart -an videos/carta-snoopy.mp4
          ffprobe -v error -show_entries stream=width,height,codec_name -show_entries format=duration -of json videos/carta-snoopy.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: carta-snoopy-mp4
          path: videos/carta-snoopy.mp4
      - name: Guardar MP4 en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos/carta-snoopy.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Exportar carta Snoopy a MP4"
            git pull --rebase
            git push
          fi
