name: Preparar vistas previas publicas
on:
  push:
    branches: [main]
    paths: ['.github/workflows/previews-privacidad.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: previews-privacidad
  cancel-in-progress: false
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow cairosvg
      - name: Reduce public previews without changing catalog paths
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          import io, base64, cairosvg
          paths = set(Path('assets/paisajes-a4').glob('*.webp'))
          paths.update(Path('assets/remeras').glob('*.webp'))
          paths.update(Path('colorear').glob('portada-*.png'))
          paths.update(Path('stickers').glob('sticker-*.png'))
          paths.update(map(Path,['assets/paisaje-a4-guia.webp','assets/paisaje-a4-color.webp','remera-tom-jerry-campo.png','cuaderno-garfield.png','cuaderno-snoopy.png','cuaderno-pluto.svg','cuaderno-zorrito-bosque.svg']))
          for p in sorted(paths):
              old=p.stat().st_size
              svg=p.suffix=='.svg'
              if svg:
                  img=Image.open(io.BytesIO(cairosvg.svg2png(url=str(p)))).convert('RGBA')
              else:
                  img=ImageOps.exif_transpose(Image.open(p)).convert('RGBA')
              w,h=img.size
              cap=720 if p.name.startswith('cuaderno-') or p.parent.name=='paisajes-a4' or p.name=='paisaje-a4-guia.webp' else 850
              if p.parent.name=='stickers': cap=350
              img.thumbnail((cap,cap),Image.Resampling.LANCZOS)
              if p.name.startswith('cuaderno-') or p.parent.name=='paisajes-a4' or p.name=='paisaje-a4-guia.webp':
                  layer=Image.new('RGBA',img.size)
                  dr=ImageDraw.Draw(layer)
                  font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',max(15,min(img.size)//24))
                  dr.text((img.width/2,img.height/2),'MUESTRA · GOSTOREUY',font=font,anchor='mm',fill=(105,105,105,110),stroke_width=1,stroke_fill=(255,255,255,80))
                  img=Image.alpha_composite(img,layer)
              if svg:
                  buf=io.BytesIO();img.save(buf,format='PNG',optimize=True)
                  encoded=base64.b64encode(buf.getvalue()).decode()
                  p.write_text(f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}"><image width="{w}" height="{h}" href="data:image/png;base64,{encoded}"/></svg>')
              elif p.suffix=='.webp':
                  img.save(p,format='WEBP',quality=78,method=6)
              else:
                  img.save(p,format='PNG',optimize=True)
              print(p, (w,h), '->',img.size,old,'->',p.stat().st_size)
          PY
      - name: Save public previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/paisajes-a4 assets/remeras colorear stickers assets/paisaje-a4-guia.webp assets/paisaje-a4-color.webp remera-tom-jerry-campo.png cuaderno-garfield.png cuaderno-snoopy.png cuaderno-pluto.svg cuaderno-zorrito-bosque.svg
          if ! git diff --cached --quiet; then git commit -m 'Public reduced previews; originals retained in private backup'; git push; fi
