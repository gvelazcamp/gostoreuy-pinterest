name: Optimizar miniaturas de stickers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimizar-miniaturas.yml'
      - 'stickers-*.png'
      - 'stickers-*.jpg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  miniaturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Crear miniaturas WebP locales
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          out=Path('assets/sticker-thumbs')
          out.mkdir(parents=True,exist_ok=True)
          for p in sorted(Path('.').glob('stickers-*')):
              if p.suffix.lower() not in ('.png','.jpg','.jpeg'): continue
              with Image.open(p) as source:
                  im=ImageOps.exif_transpose(source).convert('RGBA')
                  im.thumbnail((560,620),Image.Resampling.LANCZOS)
                  bg=Image.new('RGB',im.size,'white')
                  bg.paste(im,mask=im.getchannel('A'))
                  dest=out/(p.stem+'.webp')
                  bg.save(dest,'WEBP',quality=82,method=6)
                  print(p.name,p.stat().st_size,dest.stat().st_size)
          PY
      - name: Guardar miniaturas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sticker-thumbs
          git diff --cached --quiet && exit 0
          git commit -m 'Generar miniaturas WebP de stickers'
          git push
