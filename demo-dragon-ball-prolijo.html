const st=document.getElementById('stage'),th=document.getElementById('th'),bd=document.getElementById('body'),sheet=document.getElementById('sheet');const sl=ms=>new Promise(r=>setTimeout(r,ms));const raf=()=>new Promise(r=>requestAnimationFrame(r));function fit(){st.style.transform='scale('+Math.min(innerWidth/540,innerHeight/960)+')'}addEventListener('resize',fit);fit();
function attach(im,u,ty,w,h,r){const S=3,a=r*Math.PI/180,bw=Math.abs(w*Math.cos(a))+Math.abs(h*Math.sin(a)),bh=Math.abs(w*Math.sin(a))+Math.abs(h*Math.cos(a));const o=document.createElement('canvas');o.width=Math.ceil(bw*S);o.height=Math.ceil(bh*S);const c=o.getContext('2d');c.translate(o.width/2,o.height/2);c.rotate(a);c.drawImage(im,-w*S/2,-h*S/2,w*S,h*S);const cv=document.createElement('canvas');cv.width=450;cv.height=o.height;const g=cv.getContext('2d'),R=75;for(let dx=0;dx<cv.width;dx++){const xd=(dx+.5)/S-R;if(Math.abs(xd)>=R*.995)continue;const t=Math.asin(xd/R),cs=Math.cos(t),sx=(R*t-u+bw/2)*S-.5/cs;if(sx>=0&&sx+1/cs<=o.width)g.drawImage(o,sx,0,1/cs,o.height,dx,0,1,o.height)}cv.style.width='150px';cv.style.height=bh+'px';cv.style.top=(ty-105-bh/2)+'px';bd.appendChild(cv);return cv}
async function play(){const imgs=sources.map(src=>{const im=new Image();im.src=src;im.className='fly';return im});await Promise.all([...imgs,sheet.querySelector('img')].map(im=>im.decode()));await sl(350);const T=1.98,TX=(540-260*T)/2,TY=34;
for(let i=0;i<imgs.length;i++){const im=imgs[i],col=i%2,row=Math.floor(i/2),u=col?36:-36,ty=145+row*76,r=col?4:-4,w=Math.min(77,70*im.naturalWidth/im.naturalHeight),h=w*im.naturalHeight/im.naturalWidth;Object.assign(im.style,{width:w*T+'px',height:h*T+'px',left:(col?540:-w*T)+'px',top:(TY+(ty-h/2)*T)+'px',transform:'rotate('+r+'deg)'});st.appendChild(im);await raf();await raf();im.style.left=(TX+(130+u-w/2)*T)+'px';await sl(400);const cv=attach(im,u,ty,w,h,r);await raf();cv.style.opacity=1;im.style.opacity=0;await sl(140);im.remove()}
